[versions]
agp = "9.4.0"
coreSplashscreen = "1.2.0"
desugar_jdk_libs = "2.1.5"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.14.0"
navigationFragment = "2.9.8"
recyclerview = "1.4.0"
roomRuntime = "2.8.4"
staxApi = "1.0-2"
cardview = "1.0.0"
constraintlayout = "2.2.1"
librodeesher = "1.0.0-SNAPSHOT"

[libraries]
core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
desugar_jdk_libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar_jdk_libs" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
navigation-fragment = { module = "androidx.navigation:navigation-fragment", version.ref = "navigationFragment" }
navigation-ui = { module = "androidx.navigation:navigation-ui", version.ref = "navigationFragment" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "roomRuntime" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "roomRuntime" }
stax-api = { module = "javax.xml.stream:stax-api", version.ref = "staxApi" }
cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
librodeesher-rules = { module = "com.softwaremagico:librodeesher-rules", version.ref = "librodeesher" }
librodeesher-random = { module = "com.softwaremagico:librodeesher-random", version.ref = "librodeesher" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
