plugins {
    alias(libs.plugins.android.application)
    id 'jacoco'
}

android {
    namespace 'com.softwaremagico.librodeesher.android'
    compileSdk 37

    defaultConfig {
        applicationId "com.softwaremagico.librodeesher.android"
        minSdk 31
        targetSdk 37
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Fail an individual stalled UI test instead of leaving the full suite running indefinitely.
        // Nihal has eight automatic level-ups and has taken over ten minutes on the emulator.
        testInstrumentationRunnerArgument "timeout_msec", "1200000"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            // Produces coverage.ec on the device for the instrumented UI suite.
            testCoverageEnabled true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.recyclerview
    implementation libs.cardview
    implementation libs.core.splashscreen

    // LibroDeEsher rules engine (published to the local Maven repository).
    // Note: `librodeesher-random` must also be installed with `mvn install`.
    implementation libs.librodeesher.rules
    implementation libs.librodeesher.random
    implementation libs.librodeesher.pdf
    // OpenPDF 1.x (used by librodeesher-pdf) references java.awt classes at runtime.
    implementation libs.android.awt

    // Jackson XML/JSON (transitively from the rules module) needs the StAX API on Android.
    implementation libs.stax.api

    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // Support for desugaring Java 11+ APIs (String#isBlank, java.time, ...).
    coreLibraryDesugaring libs.desugar.jdk.libs

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

// JVM unit-test coverage. Generated Android classes are excluded so the ratio reflects the code
// written in this module; UI classes are additionally exercised by the instrumented suite.
tasks.configureEach {
    if (name == 'testDebugUnitTest') {
        finalizedBy 'jacocoTestReport'
    }
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn tasks.matching { it.name == 'testDebugUnitTest' }
    reports {
        xml.required = true
        html.required = true
        csv.required = true
    }
    sourceDirectories.setFrom(files(android.sourceSets.main.java.srcDirs))
    // Unit-test data plus the coverage.ec collected by connectedDebugAndroidTest.
    executionData.setFrom(files(
            "$buildDir/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec"
    ).filter { it.exists() })
    executionData.from(fileTree(dir: "$buildDir/outputs/code_coverage", includes: ['**/*.ec']))
    classDirectories.setFrom(files(
            fileTree(dir: "$buildDir/intermediates/javac/debug/compileDebugJavaWithJavac/classes", exclude: [
                    '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
                    '**/databinding/**', '**/*_Factory.*', '**/*_ViewBinding.*'
            ])
    ))
}
